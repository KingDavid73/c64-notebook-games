<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Insect Attack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="game-screen">
      <canvas id="game" width="320" height="200" aria-label="Insect Attack game"></canvas>
      <canvas id="modern-text" width="1280" height="800" aria-hidden="true"></canvas>
    </div>
    <div class="display-controls"><button id="text-mode" type="button" aria-pressed="false">C64 TEXT · T</button></div>
    <p>Move: arrows / WASD · Spray: Space / Z · Pause: P · Mute: M · T text mode</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
